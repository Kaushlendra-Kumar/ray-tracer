<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A physically based path tracer written in C++20, running in your browser as WebAssembly." />
    <title>Ray tracer scene editor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23777a7d'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23fff'/%3E%3C/svg%3E" />
    <script>
      // Without COOP/COEP headers the page cannot use SharedArrayBuffer, so the
      // renderer would fall back to one thread. Install public/coi-sw.js, which
      // adds them, and reload once so that it controls the page.
      (function () {
        if (window.crossOriginIsolated || !window.isSecureContext || !("serviceWorker" in navigator)) return;
        var key = "coi-sw-reloaded";
        var reloaded = false;
        try { reloaded = sessionStorage.getItem(key) === "1"; } catch (e) {}
        navigator.serviceWorker.register("coi-sw.js").then(function (reg) {
          if (reloaded || navigator.serviceWorker.controller) return;  // never loop
          var reload = function () {
            try { sessionStorage.setItem(key, "1"); } catch (e) {}
            location.reload();
          };
          if (reg.active) reload();
          else navigator.serviceWorker.addEventListener("controllerchange", reload);
        }).catch(function () {});
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" crossorigin="anonymous" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
